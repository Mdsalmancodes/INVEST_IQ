[tool.poetry]
name = "investiq-observability"
version = "0.1.0"
description = "Shared structured logging and redaction for INVEST IQ backend services"
authors = ["INVEST IQ"]
packages = [{ include = "observability" }]
include = ["observability/py.typed"]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
structlog = "^24.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
mypy = "^1.13.0"
ruff = "^0.7.2"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
