[tool.poetry]
name = "investiq-ai-service"
version = "0.1.0"
description = "INVEST IQ ai-service — prediction/sentiment/risk/optimization/SHAP (infrastructure skeleton only in Phase 1; business logic per Document 4 §10 arrives Phase 7+)"
authors = ["INVEST IQ"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.2"
pydantic-settings = "^2.6.0"
redis = "^5.1.1"
structlog = "^24.4.0"
investiq-observability = { path = "../../libs/observability", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
mypy = "^1.13.0"
ruff = "^0.7.2"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
