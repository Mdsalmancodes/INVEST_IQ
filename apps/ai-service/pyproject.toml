[tool.poetry]
name = "investiq-ai-service"
version = "0.1.0"
description = "INVEST IQ ai-service — hybrid AI/ML engine (LSTM, ARIMA, Prophet, Random Forest, XGBoost, FinBERT), decision engine, SHAP explainability (Phase 7, per Document 4 §10)"
authors = ["INVEST IQ"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.2"
pydantic-settings = "^2.6.0"
redis = "^5.1.1"
structlog = "^24.4.0"
investiq-observability = { path = "../../libs/observability", develop = true }
httpx = "^0.27.2"
numpy = "^1.26.4"
pandas = "^2.2.3"
scikit-learn = "^1.5.2"
xgboost = "^2.1.2"
statsmodels = "^0.14.4"
prophet = "^1.1.6"
yfinance = "^0.2.40"
torch = { version = "^2.5.1", source = "pytorch-cpu" }
transformers = "^4.46.2"
shap = "^0.46.0"
joblib = "^1.4.2"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"
mypy = "^1.13.0"
ruff = "^0.7.2"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# None of these ML libraries ship a py.typed marker / complete type stubs as
# of this session — a genuine third-party gap, not our code's fault (same
# category as core-api's testcontainers/yfinance/celery scoped ignores).
module = [
    "pandas.*",
    "numpy.*",
    "sklearn.*",
    "xgboost.*",
    "statsmodels.*",
    "prophet.*",
    "torch.*",
    "transformers.*",
    "shap.*",
    "joblib.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that train real models end-to-end (deselected by default; run explicitly via `pytest -m slow`)",
]
addopts = "-m 'not slow'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
